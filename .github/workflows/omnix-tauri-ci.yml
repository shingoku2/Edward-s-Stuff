name: Omnix Tauri CI

on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'omnix-tauri/**'
      - '.github/workflows/omnix-tauri-ci.yml'
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'omnix-tauri/**'
      - '.github/workflows/omnix-tauri-ci.yml'

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omnix-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('omnix-tauri/src-tauri/Cargo.lock', 'omnix-tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust
        run: |
          cd omnix-tauri/src-tauri
          cargo check --locked

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'omnix-tauri/package-lock.json'

      - name: Install and build frontend
        run: |
          cd omnix-tauri
          npm ci || npm install
          npm run build

  # Full Tauri build in correct order (beforeBuildCommand runs frontend, then Rust).
  # Use this job when you need a single ordered build or artifacts for deployment.
  tauri-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'omnix-tauri/package-lock.json'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            omnix-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('omnix-tauri/src-tauri/Cargo.lock', 'omnix-tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install deps and run full Tauri build
        run: |
          cd omnix-tauri
          npm ci || npm install
          npm run tauri:build
