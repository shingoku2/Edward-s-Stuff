name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      OMNIX_MASTER_PASSWORD: ci-only-master-password
      PYNPUT_BACKEND: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install
        run: python -m pip install --upgrade pip "setuptools>=83" ".[dev,build]"
      - name: Validate package
        run: python -m compileall -q src && python -c "import omnix; print(omnix.__version__)"
      - name: Test
        run: pytest --cov=omnix --cov-report=xml
      - name: Security scan
        run: bandit -q -r src/omnix -ll

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools>=83" ".[dev]"
      - run: find src tests -name '*.py' -exec black --check {} \;
      - run: isort --check-only src tests
      - run: flake8 src/omnix --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: pip-audit --local --skip-editable
