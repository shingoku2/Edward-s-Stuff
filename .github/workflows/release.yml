name: Unsigned desktop bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: omnix-linux
          - os: windows-latest
            artifact: omnix-windows
          - os: macos-latest
            artifact: omnix-macos
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      OMNIX_MASTER_PASSWORD: build-only-master-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip ".[build]"
      - run: pyinstaller GamingAIAssistant.spec --clean --noconfirm
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/GamingAIAssistant*
          if-no-files-found: error
