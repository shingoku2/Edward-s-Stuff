[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "omnix-gaming-companion"
version = "3.0.0"
description = "Privacy-first, local AI gaming companion"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Omnix Team" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.1",
    "filelock>=3.32.5",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "ollama>=0.6.2",
    "pdfplumber>=0.11.10",
    "psutil>=7.2.2",
    "pynput>=1.8.2",
    "pypdf>=6.17.0",
    "PyQt6>=6.11.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "pywin32>=312; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "black>=26.5.1",
    "coverage[toml]>=7.16.0",
    "flake8>=7.3.0",
    "freezegun>=1.5.5",
    "ipdb>=0.13.13",
    "ipython>=9.17.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.2",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "PyYAML>=6.0.3",
    "responses>=0.26.3",
    "types-requests>=2.33.0.20260712",
]
docs = ["sphinx>=9.0.4", "sphinx-rtd-theme>=3.1.0"]
build = ["pyinstaller>=6.22.2"]

[project.scripts]
omnix = "omnix.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnix = ["ui/*.qss"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
